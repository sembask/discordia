<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Discordia · player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #player,
      #player iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #helper {
        position: absolute;
        width: 1px;
        height: 1px;
        left: -10px;
        top: -10px;
        overflow: hidden;
      }
      #fake {
        display: grid;
        place-items: center;
        height: 100%;
        color: #fff;
        background: linear-gradient(135deg, #312e81, #6d28d9);
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <div id="helper"><div id="helper-target"></div></div>
    <script src="./player.js"></script>
  </body>
</html>
